<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movement Youth Jobs</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #ffffff;
  --muted: #a3a3a3;
  --line: #ffffff;
  --card: #0d0d0d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
  font-family: 'Trebuchet MS', Arial, Helvetica, sans-serif;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  min-height: 100vh;
}
header {
  padding: 24px 20px 16px;
  border-bottom: 2px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 2;
}
header h1 { margin: 0; font-size: 28px; line-height: 34px; text-transform: uppercase; letter-spacing: 1px; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
main { max-width: 760px; margin: 0 auto; padding: 16px 20px 40px; }
.back {
  background: none;
  color: var(--fg);
  border: 2px solid var(--line);
  padding: 10px 16px;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 20px;
  min-height: 44px;
}
.job-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.job-btn {
  width: 100%;
  text-align: left;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--line);
  padding: 16px 18px;
  min-height: 56px;
  font: inherit;
  font-size: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.job-btn:focus-visible, .back:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.job-btn .count { font-size: 14px; color: var(--muted); text-transform: none; white-space: nowrap; }
.job-title { margin: 0; font-size: 32px; line-height: 38px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: normal; }
.job-sub { margin: 6px 0 0; color: var(--muted); font-size: 17px; }
h2.section {
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: normal;
  margin: 28px 0 10px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
.tasks { list-style: none; margin: 0; padding: 0; }
.tasks li {
  border-bottom: 1px solid #333;
  font-size: 19px;
  line-height: 26px;
}
.task { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; min-height: 50px; cursor: pointer; }
.task input {
  -webkit-appearance: none;
  appearance: none;
  flex: none;
  width: 26px;
  height: 26px;
  margin: 0;
  border: 2px solid var(--fg);
  background: transparent;
  display: grid;
  place-content: center;
  cursor: pointer;
}
.task input:checked { background: var(--fg); }
.task input:checked::after {
  content: '';
  width: 7px;
  height: 13px;
  border: solid var(--bg);
  border-width: 0 3px 3px 0;
  transform: translateY(-2px) rotate(45deg);
}
.task input:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.task input:disabled { opacity: 0.35; cursor: default; }
.task input:checked + span { color: var(--muted); text-decoration: line-through; }
.dropdown { margin-top: 28px; }
.dropdown summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 16px 18px;
  min-height: 56px;
  font-size: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
}
.dropdown summary::-webkit-details-marker { display: none; }
.dropdown summary::after { content: '▾'; font-size: 20px; transition: transform 0.15s; }
.dropdown[open] summary::after { transform: rotate(180deg); }
.dropdown summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
#unfinished-count { margin-left: auto; font-size: 14px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.group { margin-top: 18px; }
.group-title {
  background: none;
  border: none;
  color: var(--fg);
  font: inherit;
  font-size: 17px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 4px 0;
  cursor: pointer;
}
.group-title:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.sync { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.sync::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6b6b6b; margin-right: 8px; vertical-align: 1px; }
.sync.live::before { background: #3ddc84; }
.sync.off::before { background: #ff5c5c; }
.people-list { font-size: 19px; line-height: 28px; margin: 0; }
.empty { color: var(--muted); font-size: 17px; }
.search-label { display: block; font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 8px 0 8px; }
.search {
  width: 100%;
  background: var(--card);
  color: var(--fg);
  border: 2px solid var(--line);
  padding: 14px 16px;
  font: inherit;
  font-size: 20px;
  min-height: 56px;
  border-radius: 0;
  -webkit-appearance: none;
}
.search::placeholder { color: #6b6b6b; }
.search:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.results { margin-top: 12px; }
.job-btn .name { text-transform: none; }
.job-btn .job-name { font-size: 15px; color: var(--muted); white-space: nowrap; }
.you { font-weight: bold; text-decoration: underline; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Movement Youth Jobs</h1>
  <p id="header-sub">Choose your job to see the tasks</p>
</header>
<main>
  <section id="list-view">
    <label class="search-label" for="name-search">Find your job</label>
    <input class="search" id="name-search" type="search" placeholder="Type your name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" autofocus>
    <ul class="job-list results" id="search-results" hidden></ul>
    <p class="empty" id="search-empty" hidden>No one found with that name. Try your first name, or pick your job below.</p>
    <h2 class="section" id="all-jobs-heading">All jobs</h2>
    <ul class="job-list" id="job-list"></ul>
    <details id="unfinished" class="dropdown" hidden>
      <summary>Unfinished tasks <span id="unfinished-count"></span></summary>
      <div id="unfinished-list"></div>
    </details>
  </section>
  <section id="detail-view" hidden>
    <button class="back" id="back-btn" type="button">Back to all jobs</button>
    <h1 class="job-title" id="detail-title"></h1>
    <p class="job-sub" id="detail-sub"></p>
    <h2 class="section">Tasks <span id="detail-progress"></span></h2>
    <ul class="tasks" id="detail-tasks"></ul>
    <p class="sync" id="sync-status">Connecting…</p>
    <h2 class="section">Assigned</h2>
    <p class="people-list" id="detail-people"></p>
  </section>
</main>
<script>
const JOBS = [
  { id: "board-game-room", title: "Board Game Room", tasks: ["Put board games away properly", "Wipe down tables", "Pack up loose pieces and dice"], people: ["Abbey Laaper", "Joyce Zamora", "Melissa Bartley"] },
  { id: "art-room", title: "Art Room", tasks: ["Collect markers, paints and brushes", "Wash brushes", "Put supplies in their bins", "Wipe tables", "Inform Pastor Isaiah via Whatsapp re: inventory"], people: ["Kate Doan", "Shania Schmidt"] },
  { id: "arcade", title: "Arcade", tasks: ["Turn off the machines", "Put away controllers", "Return Wii to Kid’s Aud"], people: ["Yaneth Andrade", "Aaron Howe", "Hayden Cocchetto"] },
  { id: "outdoor-sports", title: "Outdoor Sports", tasks: ["Collect volleyballs, basketballs, etc. and put away", "Check the court and area for trash"], people: ["Eira Feairs", "Jesse Froese"] },
  { id: "video-game-room", title: "Video Game Room", tasks: ["Put away cornhole bags and boards", "Collect and put away four-in-a-row pieces", "Turn off air hockey and put away", "Tidy room", "Put away chairs on Small Group Nights"], people: ["Andres Prado", "Jeff Faber", "Lily Jones"] },
  { id: "check-in-station", title: "Check-In Station", tasks: ["Take the iPads, power them down, and plug them in to charge", "Fold the tablecloths and put them away", "Return the TV to Closet"], people: ["Melissa Gillard", "Sarah Donkers", "Carolyn Endersby", "Carolyn Axiotis", "Aleshia Wattie"] },
  { id: "game-supplies", title: "Game Supplies", tasks: ["Sort and return all game pieces and equipment to the storage closet", "Check that nothing is missing"], people: ["Corissa Engel"] },
  { id: "new-student-room", title: "New Student Room", tasks: ["Put all paperwork and iPads away in their proper places", "Turn off and put lights away", "Check that nothing is left on surfaces"], people: ["Shanson Armstrong", "Taylor McCollum", "Hayden Gower", "Ava Ropp"] },
  { id: "production-team", title: "Production Team", tasks: ["Turn off the sound system and board", "Unplug and coil cables on Worship Nights", "Ensure Microphones are put away"], people: ["Aaron Engel", "KR Moore", "Isaac Street"] },
  { id: "tuck-shop", title: "Tuck Shop", tasks: ["Clean Up Tuck", "Wipe counters", "Empty the fridge of youth inventory", "Cash-out", "Make sure garbage is away", "Refill slushie machine"], people: ["Ana Maria Ayala Arboleda", "Jeff Feairs", "Sarah Street", "Jason Street"] },
  { id: "club-56-room", title: "Club 56 Room", tasks: ["Straighten all chairs", "Pick up any garbage", "Make sure the room is fully set up and ready for Sunday morning"], people: ["Dawson Godbout", "Olivia Garner", "Gabriel Navas"] },
  { id: "tables", title: "Tables", sub: "Activity Rooms, Hallways, Lobby, Etc.", tasks: ["Tear down all tables", "Put away in proper storage"], people: ["Zach Price", "Joe Swarath", "Nevin Cook", "Gavin Laaper"] },
  { id: "lights", title: "Lights", sub: "Hallways, Lobby, Etc.", tasks: ["Put away in proper storage"], people: ["Emma Izzard", "Isaiah Adeshigbin"] },
  { id: "bathrooms", title: "Bathrooms", sub: "Allllll the ones students have access to!", tasks: ["Go through stalls", "Pick up anything left behind", "Wipe counters", "Make sure stalls are unlocked", "Turn off lights"], people: ["Cynthia Tupling", "Lisa Ross", "Sara McNeill", "Hadassah Scholten"] },
  { id: "photography", title: "Photography", tasks: ["Return SD card(s) to Arianna’s desk", "Put cameras away", "Charge Batteries"], people: ["Rebekah Barrett", "Dawson Godbout"] },
  { id: "chairs", title: "Chairs", sub: "Main Aud", tasks: ["Straighten chairs", "Put rows back in"], people: ["Ken Drane", "Jesse Froese", "Eira Feairs", "Marlon Martes", "Brooke Wegman", "Hayden Gower", "Owen Donkers", "Sarah Koncir", "Nick Kippenhuck"] },
  { id: "pipe-and-drape", title: "Pipe & Drape", sub: "Across all rooms", tasks: ["Take down Pipe and Drape from Activity Rooms", "Put it up PROPERLY in Main Aud"], people: ["Cody Chute", "Tyler Christie", "Nathan Hannon"] }
];

const listView = document.getElementById("list-view");
const detailView = document.getElementById("detail-view");
const jobList = document.getElementById("job-list");
const headerSub = document.getElementById("header-sub");

// ---- Shared checkmarks (Firebase Realtime Database) ----
// Checks are stored under checks/<night>/<jobId>/<taskKey> = true.
// A "night" runs until 4am, so each new night starts with a clean list.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB2iX0SJNxhxqemFUiAmmjNv63SjEtf-M4",
  authDomain: "movement-youth-jobs.firebaseapp.com",
  databaseURL: "https://movement-youth-jobs-default-rtdb.firebaseio.com",
  projectId: "movement-youth-jobs",
  storageBucket: "movement-youth-jobs.firebasestorage.app",
  messagingSenderId: "1048757943956",
  appId: "1:1048757943956:web:5e3ad67eebe275fdf47e81"
};
const FIREBASE_VERSION = "10.12.2";
const NIGHT_CUTOFF_HOURS = 4;

let fb = null;          // firebase-database module
let db = null;          // database instance
let checks = {};        // { jobId: { taskKey: true } } for tonight
let nightKey = currentNight();
let unsubscribe = null;
let currentJob = null;

function currentNight() {
  const d = new Date(Date.now() - NIGHT_CUTOFF_HOURS * 3600 * 1000);
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function taskKey(task) {
  return task.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function isDone(jobId, key) { return !!(checks[jobId] && checks[jobId][key]); }
function doneCount(job) { return job.tasks.filter(t => isDone(job.id, taskKey(t))).length; }

function setStatus(state) {
  const s = document.getElementById("sync-status");
  s.className = "sync" + (state === true ? " live" : state === null ? " off" : "");
  s.textContent = state === true ? "Live: checks show for everyone and reset each night"
    : state === null ? "Couldn't connect, so checkboxes are off. Check your internet and reload."
    : "Reconnecting… your checks will sync when you're back online";
}

function refreshChecks() {
  if (currentJob) {
    document.querySelectorAll("#detail-tasks input").forEach(box => {
      box.checked = isDone(currentJob.id, box.dataset.key);
      box.disabled = !db;
    });
    document.getElementById("detail-progress").textContent =
      db ? "· " + doneCount(currentJob) + " of " + currentJob.tasks.length + " done" : "";
  }
  if (!listView.hidden) renderList();
}

function subscribe() {
  if (unsubscribe) unsubscribe();
  checks = {};
  unsubscribe = fb.onValue(fb.ref(db, "checks/" + nightKey), snap => {
    checks = snap.val() || {};
    refreshChecks();
  }, () => setStatus(null));
}

async function startSync() {
  try {
    const base = "https://www.gstatic.com/firebasejs/" + FIREBASE_VERSION + "/";
    const [appMod, dbMod] = await Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-database.js")
    ]);
    fb = dbMod;
    db = fb.getDatabase(appMod.initializeApp(FIREBASE_CONFIG));
    fb.onValue(fb.ref(db, ".info/connected"), snap => setStatus(snap.val() === true));
    subscribe();
    // Roll over to a fresh list if the page is left open past the cutoff.
    setInterval(() => {
      const k = currentNight();
      if (k !== nightKey) { nightKey = k; subscribe(); }
    }, 60 * 1000);
  } catch (err) {
    console.error(err);
    setStatus(null);
  }
}

function el(tag, props = {}, text) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  if (text !== undefined) node.textContent = text;
  return node;
}

function taskRow(job, task) {
  const key = taskKey(task);
  const li = el("li");
  const label = el("label", { className: "task" });
  const box = el("input", { type: "checkbox", disabled: !db, checked: isDone(job.id, key) });
  box.dataset.key = key;
  box.addEventListener("change", () => {
    fb.set(fb.ref(db, `checks/${nightKey}/${job.id}/${key}`), box.checked ? true : null);
  });
  label.appendChild(box);
  label.appendChild(el("span", {}, task));
  li.appendChild(label);
  return li;
}

function renderUnfinished() {
  const section = document.getElementById("unfinished");
  const list = document.getElementById("unfinished-list");
  const searching = searchInput && norm(searchInput.value) !== "";
  section.hidden = !db || searching;
  if (section.hidden) return;

  list.innerHTML = "";
  let total = 0;
  JOBS.forEach(job => {
    const left = job.tasks.filter(t => !isDone(job.id, taskKey(t)));
    if (!left.length) return;
    total += left.length;
    const group = el("div", { className: "group" });
    const title = el("button", { className: "group-title", type: "button" }, job.title);
    title.addEventListener("click", () => { selectedName = null; location.hash = job.id; });
    group.appendChild(title);
    const ul = el("ul", { className: "tasks" });
    left.forEach(t => ul.appendChild(taskRow(job, t)));
    group.appendChild(ul);
    list.appendChild(group);
  });
  document.getElementById("unfinished-count").textContent = total + " left tonight";
  if (!total) list.appendChild(el("p", { className: "empty" }, "Everything's done tonight. Nice work!"));
}

function renderList() {
  renderUnfinished();
  jobList.innerHTML = "";
  JOBS.forEach(job => {
    const li = el("li");
    const btn = el("button", { className: "job-btn", type: "button" });
    btn.appendChild(el("span", {}, job.title));
    let count = job.people.length + (job.people.length === 1 ? " person" : " people");
    if (db) count += " · " + doneCount(job) + "/" + job.tasks.length + " done";
    btn.appendChild(el("span", { className: "count" }, count));
    btn.addEventListener("click", () => { selectedName = null; location.hash = job.id; });
    li.appendChild(btn);
    jobList.appendChild(li);
  });
}

const searchInput = document.getElementById("name-search");
const searchResults = document.getElementById("search-results");
const searchEmpty = document.getElementById("search-empty");
const allJobsHeading = document.getElementById("all-jobs-heading");
let selectedName = null;

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

// One entry per person per job, so people with two jobs show both.
const ASSIGNMENTS = JOBS.flatMap(job => job.people.map(name => ({ name, job, words: norm(name).split(/\s+/) })));

function findMatches(query) {
  const q = norm(query);
  if (!q) return [];
  const qWords = q.split(/\s+/);
  return ASSIGNMENTS
    .filter(a => norm(a.name).startsWith(q) || qWords.every(qw => a.words.some(w => w.startsWith(qw))))
    .sort((a, b) => a.name.localeCompare(b.name) || a.job.title.localeCompare(b.job.title));
}

function openAssignment(a) {
  selectedName = a.name;
  location.hash = a.job.id;
}

function renderSearch() {
  const query = searchInput.value;
  const matches = findMatches(query);
  const searching = norm(query) !== "";
  searchResults.innerHTML = "";
  matches.forEach(a => {
    const li = el("li");
    const btn = el("button", { className: "job-btn", type: "button" });
    btn.appendChild(el("span", { className: "name" }, a.name));
    btn.appendChild(el("span", { className: "job-name" }, a.job.title));
    btn.addEventListener("click", () => openAssignment(a));
    li.appendChild(btn);
    searchResults.appendChild(li);
  });
  searchResults.hidden = matches.length === 0;
  searchEmpty.hidden = !searching || matches.length > 0;
  jobList.hidden = searching;
  allJobsHeading.hidden = searching;
  renderUnfinished();
}

searchInput.addEventListener("input", renderSearch);
searchInput.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const matches = findMatches(searchInput.value);
  if (matches.length === 1) openAssignment(matches[0]);
});

function renderDetail(job) {
  document.getElementById("detail-title").textContent = job.title;
  const sub = document.getElementById("detail-sub");
  sub.textContent = job.sub || "";
  sub.hidden = !job.sub;

  currentJob = job;
  const tasks = document.getElementById("detail-tasks");
  tasks.innerHTML = "";
  job.tasks.forEach(t => tasks.appendChild(taskRow(job, t)));
  refreshChecks();

  const people = document.getElementById("detail-people");
  people.innerHTML = "";
  job.people.forEach((p, i) => {
    if (i) people.appendChild(document.createTextNode(", "));
    people.appendChild(el("span", { className: p === selectedName ? "you" : "" }, p));
  });
  document.title = job.title + " | Movement Youth Jobs";
}

function route() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const job = JOBS.find(j => j.id === id);
  if (job) {
    renderDetail(job);
    listView.hidden = true;
    detailView.hidden = false;
    headerSub.textContent = "Tasks for this job";
    window.scrollTo(0, 0);
  } else {
    currentJob = null;
    renderList();
    listView.hidden = false;
    detailView.hidden = true;
    headerSub.textContent = "Choose your job to see the tasks";
    document.title = "Movement Youth Jobs";
  }
}

document.getElementById("back-btn").addEventListener("click", () => {
  history.pushState("", document.title, location.pathname + location.search);
  route();
});
window.addEventListener("hashchange", route);

renderList();
route();
startSync();
</script>
</body>
</html>
